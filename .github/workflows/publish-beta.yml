name: Publish beta

on:
  workflow_dispatch:
    inputs:
      platformlar:
        description: 'Platformlar (virgullu): epic,msix'
        required: true
        default: 'epic,msix'
      etiket:
        description: 'Surum etiketi (bos = otomatik benzersiz etiket)'
        required: false
        default: ''
      artifact:
        description: 'Aday paket artifact adi (aday klasorlerini depo kokune acar)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download candidate artifact
        if: ${{ inputs.artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: .

      - name: Check GitHub CLI authentication
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status

      - name: Publish beta (GitHub Releases)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $platformlar = "${{ inputs.platformlar }}".Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          $arg = @('-GitHub', '-Onayla', '-Platform') + $platformlar
          if ("${{ inputs.etiket }}".Trim()) { $arg += @('-Etiket', "${{ inputs.etiket }}".Trim()) }
          Write-Host ("Calistiriliyor: Publish-Beta.ps1 " + ($arg -join ' '))
          ./tools/distribution/Publish-Beta.ps1 @arg

      - name: Commit beta manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/updates/beta
          if (git diff --cached --quiet) {
            Write-Host 'Manifestte degisiklik yok.'
            exit 0
          }
          git commit -m "beta: manifest guncellendi"
          git push
